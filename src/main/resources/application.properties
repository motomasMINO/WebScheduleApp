spring.datasource.url=jdbc:mysql://localhost:3306/schedule_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&useUnicode=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ↓ 自分のMySQLユーザー名・パスワードに変更してください
spring.datasource.username=${DB_USERNAME:your_username}
spring.datasource.password=${DB_PASSWORD:your_password}

# Flywayの設定
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8

# Springの組み込みSQL自動初期化を無効にする
spring.sql.init.mode=never

# Flyway実行後にJPA初期化を行う
spring.jpa.defer-datasource-initialization=false

# Hibernateによる自動DDLは無効化（Flywayで管理）
spring.jpa.hibernate.ddl-auto=validate

spring.devtools.restart.enabled=false

spring.main.allow-circular-references=true

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ログイン</title>
  <link rel="stylesheet" href="/Style.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <h2>ログイン</h2>

    <form id="loginForm" action="/login" method="post" onsubmit="login(event)">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
  
      <!-- JSで取得するため、idとSpring用のname両方をつける -->
      <input type="text" id="username" name="username" placeholder="ユーザー名" required>
      <input type="password" id="password" name="password" placeholder="パスワード" required>

      <button type="submit">ログイン</button>
    </form>

    <br><br>
    <button onclick="location.href='Signup.html'">ユーザー登録はこちら</button>
  </div>
  <script src="/Login.js"></script>
</body>
</html>
